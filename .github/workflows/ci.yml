name: CI

on:
  push:
    branches: ["**"]      # run on every branch push
  pull_request:
    branches: [main]      # run on PRs targeting main

env:
  # Silence the "Node.js 20 deprecated" warning until GitHub flips the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint + Unit + Feature Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath, gd, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Laravel Pint) — informational only
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Run tests (Pest) — Unit suite only (POC scope)
        env:
          GROQ_API_KEY: fake-key-for-ci
          PIXABAY_API_KEY: fake-key-for-ci
        run: vendor/bin/pest --testsuite=Unit

  performance:
    name: JMeter Performance Test (A6)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath, gd, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17 (required by JMeter)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies & build assets
        run: npm ci && npm run build

      - name: Prepare app (SQLite + file drivers, no external services)
        run: |
          cp .env.example .env
          # Use a self-contained SQLite DB and file-based session/cache so the
          # app boots in CI without MySQL or any external service.
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE=database/database.sqlite#' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Boot the application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          echo "Waiting for app to come up..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/login > /dev/null; then
              echo "App is up."; exit 0
            fi
            sleep 2
          done
          echo "App failed to start:"; cat serve.log; exit 1
        env:
          GROQ_API_KEY: fake-key-for-ci
          PIXABAY_API_KEY: fake-key-for-ci

      - name: Install Apache JMeter 5.6.3
        run: |
          curl -fsSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz

      - name: Run JMeter test plan & generate HTML report
        run: |
          apache-jmeter-5.6.3/bin/jmeter -n \
            -t jmeter/cookease-load-test.jmx \
            -Jhost=127.0.0.1 -Jport=8000 \
            -l results.jtl \
            -e -o jmeter-html-report

      - name: Show JMeter summary
        if: always()
        run: cat jmeter.log || true

      - name: Upload JMeter HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: |
            jmeter-html-report
            results.jtl

  docker-build:
    name: Build Docker image (smoke test)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cookease:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-deploy:
    name: Push Docker image to Docker Hub (A7)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (latest + commit SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cookeasev2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cookeasev2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
