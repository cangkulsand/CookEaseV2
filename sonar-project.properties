# SonarCloud configuration for CookEase
# NOTE: organization + projectKey must EXACTLY match the values shown on your
# SonarCloud project's "Information" page, or the scan will fail.
sonar.organization=cangkulsand
sonar.projectKey=cangkulsand_CookEaseV2
sonar.projectName=CookEaseV2

# What to analyze
sonar.sources=app,routes,config,database,resources
sonar.tests=tests

# What to ignore
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**

# PHP settings
sonar.php.file.suffixes=.php
sonar.sourceEncoding=UTF-8
